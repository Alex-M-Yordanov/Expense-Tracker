version: '3'
services:
  backend:
    build:
      context: ./backend  
    ports:
      - "5000:5000"
    command: python main.py --host=0.0.0.0
    volumes:
      - ./backend:/app 
    environment:
      - FLASK_APP=main.py
      - FLASK_ENV=development
      - SQLALCHEMY_DATABASE_URI=mysql+pymysql://root:root@db:3306/Expenses_db
      - MYSQL_HOST=db
    depends_on:
      db:
        condition: service_healthy  
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend  
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app  
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true  
      - WATCHPACK_POLLING=true
      - HOST=0.0.0.0
    networks:
      - app-network

  db:
    image: mysql:5.7  
    environment:
      MYSQL_ROOT_PASSWORD: root  
      MYSQL_DATABASE: Expenses_db  
    ports:
      - "3307:3306" 
    volumes:
      - db-data:/var/lib/mysql  
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "db", "-u", "root", "-ppassword"]
      interval: 30s
      retries: 5
      start_period: 30s
      timeout: 10s

networks:
  app-network:
    driver: bridge

volumes:
  db-data:
